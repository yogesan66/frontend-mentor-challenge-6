<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Expenses chart component</title>
  <link rel="stylesheet" href="./index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
<header></header>
<main class="main-container">
  <div class="content-card">
    <div class="first-card">
      <div class="balance">
        <span class="heading">My balance</span>
        <span class="price">$921.48</span>
      </div>
  
        <img class="logo" src="./images/logo.svg" width="15%" alt="logo">
    </div>
    <div class="chart-card">
      <div class="chart-heading">
        Spending - Last 7 days
      </div>
      <div class="charts">
   
      </div>
      <hr class="divider"/>
      <div class="card-footer">
        <div class="total">
          <span class="light">Total this month</span>
          <span class="total-price"><b>$478.33</b></span>
        </div>
        <div class="percent">
          <span class="percent-label"><b>+2.4%</b></span>
          <span class="light">from last month</span>
        </div>
      </div>
    </div>
  </div>

</main>
<footer>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Yogesan</a>.
  </div>
</footer>
 
<script src="./index.js"></script>
</body>
</html>
